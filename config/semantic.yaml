  - generate or complete point clouds
  - point-based scene reconstruction
- topic: surface_reconstruction
  hints:
  - recover continuous object or scene surfaces
  - implicit surface fitting
  - signed distance or occupancy surface recovery
- topic: mesh_reconstruction
  hints:
  - recover triangle meshes from images or points
  - predict vertices and faces
  - explicit mesh geometry reconstruction
- topic: nerf
