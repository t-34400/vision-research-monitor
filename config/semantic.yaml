version: 1
enabled: true
model:
  id: topic-profile-tfidf-v1
  word_ngram_min: 1
  word_ngram_max: 2
  char_ngram_min: 3
  char_ngram_max: 5
  word_weight: 0.7
  char_weight: 0.3
classification:
  minimum_topic_similarity: 0.12
  relative_topic_ratio: 0.68
  maximum_topics: 4
  acceptance_similarity: 0.16
  full_scale_similarity: 0.4
  enrichment_similarity: 0.22
llm:
  enabled: false
  minimum_semantic_score: 0.1
  maximum_semantic_score: 0.28
  maximum_candidate_topics: 4
profiles:
- topic: image_classification
  hints:
  - categorize an entire image
  - assign an image-level class label
  - recognize the category of a picture
- topic: object_detection
  hints:
  - localize objects with bounding boxes
  - find and classify objects in an image
  - object localization
- topic: semantic_segmentation
  hints:
  - assign a class to every pixel
  - pixel-wise scene parsing
  - dense per-pixel classification
- topic: instance_segmentation
  hints:
  - separate object instances with masks
  - instance-level masks
  - segment individual objects
- topic: panoptic_segmentation
  hints:
  - unify semantic and instance segmentation
  - panoptic scene parsing
  - things and stuff segmentation
- topic: open_vocabulary_recognition
  hints:
  - recognize unseen categories from text
  - text-guided detection or segmentation
  - open set visual categories
- topic: vision_foundation_models
  hints:
  - general-purpose pretrained vision model
  - large visual pretraining model
  - transferable visual foundation model
  required_any:
  - vision
  - visual
  - image
  - video
  - camera
  - perception
- topic: visual_representation_learning
  hints:
  - learn transferable visual features
  - visual embeddings for downstream tasks
  - feature representation pretraining
- topic: feature_matching
  hints:
  - establish correspondences between images
  - match local keypoints across views
  - image pair correspondence
- topic: object_tracking
  hints:
  - maintain object identities through video
  - track trajectories across frames
  - temporal object association
- topic: video_understanding
  hints:
  - recognize actions and events in video
  - temporal video representation
  - reason over video sequences
- topic: image_restoration
  hints:
  - recover clean images from degraded observations
  - remove blur or noise
  - inverse imaging restoration
- topic: super_resolution
  hints:
  - increase image spatial resolution
  - recover high-resolution detail from low-resolution input
  - image upsampling
- topic: vision_language_models
  hints:
  - joint image and language reasoning
  - multimodal image text model
  - visual question answering with language models
  required_groups:
  - - vision
    - visual
    - image
    - multimodal
    - video
  - - language
    - text
    - caption
    - question
    - multimodal
- topic: structure_from_motion
  hints:
  - recover camera motion and sparse 3d geometry from photos
  - joint camera pose and sparse structure estimation
  - unordered image reconstruction
- topic: multi_view_stereo
  hints:
  - recover dense geometry from multiple calibrated views
  - dense multi-view reconstruction
  - depth fusion from many images
- topic: camera_pose_estimation
  hints:
  - estimate six degree of freedom camera pose
  - localize a camera in a scene
  - relative or absolute camera orientation and position
- topic: camera_calibration
  hints:
  - estimate camera intrinsics and extrinsics
  - recover focal length or lens distortion
  - calibrate imaging geometry
- topic: monocular_depth
  hints:
  - estimate depth from a single rgb image
  - single-view depth prediction
  - per-pixel depth from one camera
- topic: metric_depth
  hints:
  - predict depth in absolute physical scale
  - depth measured in meters
  - absolute scene distance
- topic: stereo_depth
  hints:
  - estimate disparity and depth from a stereo pair
  - two-camera depth estimation
  - binocular correspondence for depth
- topic: multi_view_depth
  hints:
  - estimate depth from several camera views
  - multi-camera depth prediction
  - aggregate views for depth
- topic: feed_forward_3d_reconstruction
  hints:
  - reconstruct 3d in one network forward pass
  - direct neural 3d reconstruction without optimization
  - single-pass 3d reconstruction
- topic: pose_free_3d_reconstruction
  hints:
  - reconstruct 3d without known camera poses
