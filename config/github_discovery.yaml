version: 1
window:
  initial_lookback_hours: 36
  overlap_minutes: 120
  max_catchup_hours: 96
  minimum_split_minutes: 15
search:
  per_page: 100
  max_pages_per_slice: 10
  request_interval_seconds: 2.1
  public_only: true
  exclude_archived: true
  exclude_forks: true
  locations:
  - name
  - description
  - topics
  query_evidence_score: 0.10
  minimum_topic_relevance_score: 0.40
  minimum_venue_relevance_score: 0.2
  pushed_minimum_stars: 50
  max_readme_enrichments_per_run: 100
  vision_context_terms:
  - vision
  - visual
  - image
  - video
  - camera
  - 3d
  - point cloud
  - rendering
  - reconstruction
  - depth
  - detection
  - segmentation
  - pose
  - tracking
  - slam
  - robot
  - robotics
  - embodied
  - avatar
  - human
  - face
  - hand
  - body
  - nerf
  - gaussian splatting
  - augmented reality
  - mixed reality
  - virtual reality
research_quality:
  baseline_score: 0.15
  research_candidate_score: 0.40
  minimum_venue_only_score: 0.40
  semantic_only_acceptance_similarity: 0.28
  research_term_bonus: 0.30
  publication_link_bonus: 0.50
  venue_bonus: 0.15
  homepage_bonus: 0.05
  stars_50_bonus: 0.10
  stars_250_bonus: 0.05
  stars_1000_bonus: 0.05
  collection_cap: 0.15
  tutorial_cap: 0.25
  collection_terms:
  - awesome
  - curated list
  - paper list
  - papers list
  - resource list
  - reading list
  tutorial_terms:
  - tutorial
  - introduction
  - beginner
  - coursework
  - assignment
  - student project
  - hands-on introduction
  research_terms:
  - official implementation
  - official code
  - code for our paper
  - code for the paper
  - paper implementation
  - implementation of
  - research code
  - benchmark
  - dataset
  - framework
  - library
  - pretrained weights
  - pretrained model
  - checkpoint
  - arxiv
  - openreview
  publication_hosts:
  - arxiv.org
  - openreview.net
  - doi.org
  - openaccess.thecvf.com
  - paperswithcode.com
