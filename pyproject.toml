[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-research-monitor"
version = "0.1.0"
description = "Automated research monitoring for computer vision and 3D vision"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
  "types-PyYAML",
]

[tool.uv]
required-version = ">=0.11.0"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = ["src/vision_research_monitor"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
