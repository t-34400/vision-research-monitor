[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-research-monitor"
version = "0.1.0"
description = "Automated research monitoring for computer vision and 3D vision"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
