name: Collect arXiv

on:
  schedule:
    - cron: "37 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-monitor-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector
        run: python -m pip install .

      - name: Collect arXiv papers
        id: collect
        shell: bash
        run: |
          set +e
          python -m vision_research_monitor.cli.arxiv
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify protected workspace metadata
        shell: bash
        run: |
          if ! git diff --quiet -- .chatgpt-workspace-manifest.json; then
            echo ".chatgpt-workspace-manifest.json must never be modified"
            exit 1
          fi

      - name: Commit collected state and items
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/items data/state/arxiv.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/items data/state/arxiv.json
          git commit -m "Update arXiv research data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Propagate collector failure
        if: steps.collect.outputs.status != '0'
        shell: bash
        run: exit "${{ steps.collect.outputs.status }}"
