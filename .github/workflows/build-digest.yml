name: Build Daily Digest

on:
  schedule:
    - cron: "45 8 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Digest period end date (YYYY-MM-DD); empty uses the current Asia/Tokyo date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: research-monitor-writes
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANONICAL_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked runtime environment
        run: uv sync --locked --no-dev

      - name: Build daily digest
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [[ -n "$REPORT_DATE" ]]; then
            uv run --locked --no-sync python -m vision_research_monitor.cli.build_digest --date "$REPORT_DATE"
          else
            uv run --locked --no-sync python -m vision_research_monitor.cli.build_digest
          fi

      - name: Build long-term analytics
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [[ -n "$REPORT_DATE" ]]; then
            uv run --locked --no-sync python -m vision_research_monitor.cli.build_trends --date "$REPORT_DATE"
          else
            uv run --locked --no-sync python -m vision_research_monitor.cli.build_trends
          fi

      - name: Verify protected workspace metadata
        shell: bash
        run: |
          if ! git diff --quiet -- .chatgpt-workspace-manifest.json; then
            echo ".chatgpt-workspace-manifest.json must never be modified"
            exit 1
          fi

      - name: Commit derived reports and analytics
        shell: bash
        run: |
          .github/scripts/commit-runtime-changes.sh 'Update daily research reports' data/entities data/ranking data/analytics data/archive reports/daily reports/trends
