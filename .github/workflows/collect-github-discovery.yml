name: Collect GitHub Discovery

on:
  schedule:
    - cron: "47 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-monitor-writes
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANONICAL_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked runtime environment
        run: uv sync --locked --no-dev

      - name: Discover GitHub repositories
        id: collect
        env:
          GH_DISCOVERY_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN || github.token }}
        shell: bash
        run: |
          set +e
          uv run --locked --no-sync python -m vision_research_monitor.cli.github_discovery
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify protected workspace metadata
        shell: bash
        run: |
          if ! git diff --quiet -- .chatgpt-workspace-manifest.json; then
            echo ".chatgpt-workspace-manifest.json must never be modified"
            exit 1
          fi

      - name: Commit collected state and items
        shell: bash
        run: |
          .github/scripts/commit-runtime-changes.sh 'Update GitHub discovery data' data/items data/state/github_discovery.json

      - name: Propagate collector failure
        if: steps.collect.outputs.status != '0'
        shell: bash
        run: exit "${{ steps.collect.outputs.status }}"
