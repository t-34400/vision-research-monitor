name: Collect Hugging Face

on:
  schedule:
    - cron: "29 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-monitor-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANONICAL_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked runtime environment
        run: uv sync --locked --no-dev

      - name: Collect Hugging Face models
        id: collect
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set +e
          uv run --locked --no-sync python -m vision_research_monitor.cli.huggingface
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify protected workspace metadata
        shell: bash
        run: |
          if ! git diff --quiet -- .chatgpt-workspace-manifest.json; then
            echo ".chatgpt-workspace-manifest.json must never be modified"
            exit 1
          fi

      - name: Commit collected state and items
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/items data/state/huggingface.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/items data/state/huggingface.json
          git commit -m "Update Hugging Face research data"
          git pull --rebase origin "$CANONICAL_BRANCH"
          git push origin "HEAD:$CANONICAL_BRANCH"

      - name: Propagate collector failure
        if: steps.collect.outputs.status != '0'
        shell: bash
        run: exit "${{ steps.collect.outputs.status }}"
